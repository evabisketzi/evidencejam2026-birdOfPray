  study_state_or_province: Michigan; Vermont; New York; Ontario
  study_period_start: '2000'
  study_period_end: '2003'
  study_temporal_note: Northern Lake Michigan, Parry Sound (Georgian Bay, Lake Huron) and Lake Champlain. Egg sampling fall
    2000-2002; gillnetting fall 2002; overwinter egg bags 2001-02 and 2002-03; emergent fry traps spring 2001-2003.
  study_design: observational_cross_sectional
