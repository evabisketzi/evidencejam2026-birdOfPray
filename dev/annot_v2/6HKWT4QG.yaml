- id: causal_mosaic:decreased_competitive_ability_of_aspen_seedlings_against_com_dece
  name: Decreased competitive ability of aspen seedlings against competing vegetation
  entity_type: taxon
  entity_term: NCBITaxon:3693
  measured_attribute: competitive ability against competing vegetation
  state_or_change_qualifier: decreased
  life_stage: germinant_or_seedling
  life_stage_term: PO:0007131
  source_spans:
  - text: While the simultaneous influence of initial height and root-to-shoot ratio could not be separated in this study,
      taller seedlings were not competitive as they were limited by a lower root-to-shoot ratio.
    section: conclusion
    start_char: 57626
    end_char: 57829
  - text: Although we did not find substantive differences between short and medium seedlings, planting a short seedling (<46
      cm height) in a competitive environment could pose risks in a longer time frame (3–5 years) if the seedling is not able
      to overtop competing vegetation (our study did not address this timeline).
    section: conclusion
    start_char: 57993
    end_char: 58303
  annotator: camo_agent:claude-opus-5-5
- id: causal_mosaic:increased_establishment_success_of_planted_aspen_seedlings_1290
  name: Increased establishment success of planted aspen seedlings
  entity_type: taxon
  entity_term: NCBITaxon:3693
  measured_attribute: establishment success
  state_or_change_qualifier: increased
  life_stage: germinant_or_seedling
  life_stage_term: PO:0007131
  source_spans:
  - text: Regardless of these drivers, early seedling growth is crucial and may require the management or control of vegetation
      beyond the first year, especially on very competitive sites.
    section: discussion
    start_char: 51710
    end_char: 51888
  - text: While initial seedling morphology can be tailored for drier site conditions to a certain extent (Pinto et al. [2011;](#page-12-0)
      Landhäusser et al. [2012b\)](#page-11-0), there are physiological limitations within a given species where manipulation
      of seedling morphology is not sufficient (Rose et al. [1993\)](#page-12-0) and other species or selected drought tolerant
      genotypes may have to be used on these sites.
    section: discussion
    start_char: 55780
    end_char: 56197
  annotator: camo_agent:claude-opus-5-5
