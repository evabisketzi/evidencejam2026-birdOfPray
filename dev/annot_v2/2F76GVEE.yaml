- id: causal_mosaic:ch4_flux_d58c
  name: CH4 flux
  entity_type: environmental_process
  entity_term: methane flux
  measured_attribute: mean CH4 flux
  state_or_change_qualifier: increased
  source_spans:
  - text: Water table was also related to CH4 flux, with higher emissions from wet sites.
    section: abstract
    start_char: 1804
    end_char: 1883
  - text: Restoration activities should avoid creating very dry microsites where greenhouse gas emissions will remain high,
      while very wet sites may accumulate carbon as CO2 but will likely create areas of high CH4 flux.
    section: abstract
    start_char: 1884
    end_char: 2094
  - text: Methane flux was significantly different between sites (Fig. 2; Kruskal–Wallis, df = 2, H = 10.71, p = 0.005).
    section: results
    start_char: 27999
    end_char: 28109
  - text: Pairwise comparison indicated that the unrestored site CH<sub>4</sub> flux was not significantly different from
      dry restored (Mann–Whitney, p = 0.11) or wet restored sites (Mann–Whitney, p = 0.04) although the latter is likely due
      only to the low number of replicate plots at the unrestored site.
    section: results
    start_char: 28110
    end_char: 28406
  - text: Wet restored plots had significantly higher CH<sub>4</sub> flux than dry restored plots (Mann–Whitney, p = 0.006).
    section: results
    start_char: 28407
    end_char: 28521
  - text: Mean seasonal CH<sub>4</sub> flux varied with water table with log (total season CH<sub>4</sub> flux + 1) increasing
      as mean season water table position became shallower (Fig. 5;  $R^2$ (adj)=0.25, p=0.057).
    section: results
    start_char: 28523
    end_char: 28730
  - text: Water table also largely controls CH4 flux (this study, [Couwenberg](#page-8-0) [and](#page-8-0) [Fritz,](#page-8-0)
      [2012\)](#page-8-0) and thus, while wet restored sites were larger seasonal sinks for CO2, they were also much larger
      sources of CH4.
    section: discussion
    start_char: 43913
    end_char: 44163
  - text: At wet microsites carbon accumulation is likely to be encouraged, but CH4 emissions can also be high.
    section: discussion
    start_char: 47259
    end_char: 47360
  - text: Water table position on the restored peatland was well correlated to both CO2 and CH4 flux.
    section: conclusion
    start_char: 48711
    end_char: 48802
  - text: On the other hand, some of the wettest plots were also very large sources of CH4.
    section: conclusion
    start_char: 49037
    end_char: 49118
  - text: Although wet sites will likely accumulate more carbon, there is potential for large CH4 efflux.
    section: conclusion
    start_char: 49242
    end_char: 49337
  annotator: camo_agent:claude-opus-5-5
