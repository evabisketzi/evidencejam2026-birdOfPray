- id: causal_mosaic:competition_control_maintained_for_an_additional_growing_sea_e542
  name: Competition control maintained for an additional growing season
  entity_type: management_intervention
  entity_term: extended competing-vegetation control
  state_or_change_qualifier: occurred
  applied_to:
  - entity_type: taxon
    entity_term: NCBITaxon:4479
  - entity_type: composite_variable
    entity_term: forbs
  source_spans:
  - text: Regardless of these drivers, early seedling growth is crucial and may require the management or control of vegetation
      beyond the first year, especially on very competitive sites.
    section: discussion
    start_char: 51710
    end_char: 51888
  - text: Our study did illustrate that short-term competition control was impactful and if this treatment had been maintained
      for an additional growing season it may have been a sufficient time period to allow seedlings from the short and medium-size
      classes to better tolerate or even suppress competing vegetation at this planting density.
    section: conclusion
    start_char: 58304
    end_char: 58636
  annotator: camo_agent:claude-opus-5-5
- id: causal_mosaic:creating_site_conditions_that_enhance_root_development_and_m_02b7
  name: Creating site conditions that enhance root development and moisture availability
  entity_type: management_intervention
  entity_term: site amelioration
  state_or_change_qualifier: occurred
