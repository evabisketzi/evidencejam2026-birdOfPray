- finding_id: f19
  sentence: Because there were no significant changes in numbers of Alliaria petiolata
    rosettes between year 1 autumn and year 2 early spring or between year 2 early
    spring and year 2 late spring, the impact of Sanguinaria canadensis on rosettes
    was probably related to its effect on seedlings rather than direct suppression
    of rosettes; higher S. canadensis densities likely killed or harmed enough seedlings
    that fewer survived to produce year 1 rosettes, and survivors produced smaller
    rosettes.
  fit: lossy
  graph:
    graph_id: 567f2b10444a436096aa9c37e6e471e4-f19
    schema_version: 0.10.0
    provenance:
      causal_mosaic_version: 0.10.0
