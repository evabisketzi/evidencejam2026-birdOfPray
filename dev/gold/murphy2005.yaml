- finding_id: f2
  sentence: Initial Sanguinaria canadensis densities of 9 and 11 ramets/m2 resulted
    in the lowest numbers of late-spring Alliaria petiolata seedlings, numbers and
    sizes of year 1 and 2 rosettes, numbers and gross areas of stem leaves, numbers
    of flowering individuals, number of flowers, number of fruits (siliques), and
    height at flowering.
