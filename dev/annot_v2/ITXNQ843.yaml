  source_corpus: 'Single article: Stover, Naeth & Wilkinson 2017, Applied Vegetation Science 20(4)'
  project: EcoWeaver
source_documents:
- document_id: 10.1111/avsc.12316
  doi: 10.1111/avsc.12316
  title: Glyphosate, steam and cutting for non-native plant control in Alberta fescue grassland restoration
  authors:
  - Holly J. Stover
  - M. Anne Naeth
  - Sarah R. Wilkinson
  year: 2017
  journal: Applied Vegetation Science
  study_coordinates:
  - latitude: 49.0517
    longitude: -113.9142
    elevation_m: 1280
    coordinate_uncertainty_m: 10000
    coordinate_location_basis:
    - nearest_municipality
    geodetic_datum: WGS84
  study_country: CA
  study_state_or_province: Alberta
  study_period_start: 2010-07
  study_period_end: 2013-08
  study_temporal_note: Baseline vegetation July 2010; treatments late July 2010 and May-June 2011; seeding June 2011 and transplanting
    June 2012 in all plots; assessments late July/early August 2011-2013; soils sampled September 2011. Coordinates are Waterton
    Park townsite (the paper gives none; sites lie within a 3-km radius of each other in Waterton Lakes National Park).
  study_design: randomized_experiment
  sample_size_value: 33
  sample_size_unit: plots
  sampling_effort_protocol: 'Randomized incomplete block design: 3 sites (blocks) of 0.3 ha, each in 12 plots, with cutting,
    glyphosate, steam and control randomly assigned to 3 plots each (no steam at Site 2, so 33 treated or control plots);
    ten 0.1-m2 quadrats on two transects per plot; ocular canopy cover by species; analysed by site (one-way ANOVA in proc
    mixed, Tukey), paired t-tests 2010 vs 2013, NMDS with Spearman correlations, MRPP and indicator species analysis; plus
    an undisturbed reference plot per site'
  is_sampling_effort_reported: true
