  entity_type: management_intervention
  entity_term: repeated herbicide application at 2-3 year intervals
  state_or_change_qualifier: occurred
  applied_to: *id001
  source_spans:
  - text: The effects of herbicide are often shortlived, so repeated herbicide application has been recommended
      for every 2–3 yr to prevent reinvasion (Holl et al. 2014).
    section: discussion
  annotator: camo_agent:claude-opus-5-5
- id: causal_mosaic:spot_spraying_of_herbicide_187b
