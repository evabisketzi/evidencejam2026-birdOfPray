nodes:
- id: causal_mosaic:lake_michigan_sites_8739
  name: Lake Michigan sites
  entity_type: environmental_variable
  entity_term: northern Lake Michigan
  measured_attribute: study lake
  state_or_change_qualifier: present
  source_spans:
  - text: Egg deposition was lowest in Lake Michigan (0.4–154.5 eggs•m*–*2, median = 1.7), intermediate in Parry Sound (39–1,027
      eggs•m–2, median = 278), and highest in Lake Champlain (0.001–9,623 eggs•m–2, median = 652).
    section: abstract
    start_char: 1554
    end_char: 1765
  - text: 'Fry collections in fry traps followed the same trend: no fry in Lake Michigan, 0.005–0.06 fry•trap–1 day–1 in Parry
      Sound, and 0.08–3.6 fry•trap–1 in Lake Champlain.'
    section: abstract
    start_char: 1766
    end_char: 1931
  - text: Egg survival to hatch in overwinter egg bags was similar in Lake Michigan (7.6%) and Parry Sound (2.3–8.9%) in 2001–02,
      and varied in Lake Champlain (0.4–1.1% in 2001–02, and 1.8–18.2 in 2002–03).
    section: abstract
    start_char: 1932
    end_char: 2128
  - text: Silt and organic material were absent or present in small quantities; over all sites, Lake Michigan had more zebra
      mussels, periphyton, and siltation than the other two lakes (Table 1).
    section: results
    start_char: 33610
    end_char: 33795
  - text: No lake trout were caught during 19.1 hr of gillnetting over five reefs in Lake Michigan, an effort greater than
      either of the other two lakes.
    section: results
    start_char: 34937
    end_char: 35080
  - text: Across all sampling years, egg densities were the lowest in Lake Michigan (0.4–154.5 eggs•m–2), intermediate in
      Parry Sound (39–1,027 eggs•m–2), and highest overall in Lake Champlain but with higher variation among sites (0.001–9,623
      eggs•m–2; Table 3).
    section: results
    start_char: 37245
    end_char: 37498
  - text: Fry collections in egg bags were highest at Grand Isle (mean 107 fry• m–2) in Lake Champlain, and similar among
      the LTB crib (12 ± 26 fry•m–2) in Lake Michigan and Davy (12 ± 27 fry• m–2) and Bar (12 ± 32 fry• m–2) Island sites
      in Parry Sound.
    section: results
    start_char: 38796
    end_char: 39039
  - text: Fry emergence as measured by fry traps yielded similar results – high fry density and CPUE in Lake Champlain (0
      to 907.5 fry• m–2 and 0 to 3.6 fry• trap–1• day–1), lower densities in Parry Sound (0 to 9• m–2 and 0 to 0.06 fry• trap–1•
      day–1), and no emergent fry captured in Lake Michigan (Table 4).
    section: results
  - text: The number of hatched fry in egg bags compared with egg density estimated in bags removed in fall was lowest in
      Lake Champlain (0.4–1.1%), and similar in Lake Michigan (7.6%) and Parry Sound (2.3–8.9%) in 2001–02 (Table 5).
    section: results
    start_char: 47986
    end_char: 48209
  - text: Overall, we found that the proportion of reefs visited by lake trout, number of adult lake trout, density of eggs
      deposited, and number of fry hatched were highest in Lake Champlain, intermediate in Lake Huron, and the lowest in Lake
      Michigan.
    section: discussion
    start_char: 48232
    end_char: 48475
  - text: The total reef area available for lake trout spawning appears to be highest in Lake Michigan, intermediate in Lake
      Champlain, and smallest in Parry Sound.
    section: discussion
  - text: In general, sites in Lake Michigan had higher levels of periphyton and higher water clarity than in Lake Champlain;
      water clarity in Parry Sound was greater and the substrate was cleaner than in the other two lakes.
    section: discussion
    start_char: 57184
    end_char: 57399
  - text: Catches of adult lake trout in gillnets, while small, confirmed the patterns observed for egg deposition; the highest
      numbers were captured in Lake Champlain and no lake trout were captured in Lake Michigan surveys.
    section: discussion
    start_char: 58420
    end_char: 58635
  - text: Fry hatch and emergence, measured with egg bags and fry traps respectively, were highest in Lake Champlain, intermediate
      in Parry Sound, and lowest in Lake Michigan.
    section: discussion
    start_char: 62526
    end_char: 62691
  annotator: camo_agent:claude-opus-5-5
