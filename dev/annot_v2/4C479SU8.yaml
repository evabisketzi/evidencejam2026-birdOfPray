  source_spans:
  - text: Reductions in small trees were mirrored by the significantly lower densities of saplings, but not adult trees (>7.5
      cm DBH), within browsed plots in 1993 compared to adjacent exclosures ( $\chi^2_2$  = 13.88, p < 0.001 and  $\chi^2_2$  =
      2.06, p = 0.357, respectively; Fig. 3).
    section: results
    start_char: 22110
    end_char: 22387
  - text: The densities of small trees within exclosures were more than four times greater than in forest plots, and larger
      size classes were more abundant within exclosures in 2009 (D = 0.33, p < 0.001; [Fig. 2C](#page-3-0) and D).
    section: results
  - text: The size-structure of the exclosures also differed from that within forest-plots in 1981, with greater densities
      of small and large (>20 cm DBH) trees within exclosures (D = 0.36, p < 0.001; [Fig. 2\)](#page-3-0).
    section: results
    start_char: 25222
    end_char: 25435
  - text: 'Light levels were significantly greater outside of the exclosures due to lower tree densities (mean ± standard
      error: 3.2 ± 1.0 and 4.1 ± 0.8% PAR in exclosures and control plots, respectively; final model with only effect of exclosure
      treatment nested within exclosure site versus model with only exclosure site: v2 <sup>2</sup> = 18.74, p < 0.001).'
    section: results
    start_char: 25436
    end_char: 25786
  - text: However, during the period of increased basal area and declines in stem density within our plots (1981–1996), the
      effects of deer were clearly evident from the greater densities of small trees within exclosures.
    section: discussion
    start_char: 31968
    end_char: 32179
  annotator: camo_agent:claude-opus-5-5
