  life_stage: mixed_or_whole_population
  source_spans:
  - text: Despite significant and sustained deer herd reductions between 1996 and 2009, which reduced deer densities to 7
      deer km<sup>-2</sup>, there was limited recruitment of small trees and declines in basal area of tree species that were
      sensitive to deer browsing.
    section: abstract
    start_char: 1781
    end_char: 2040
  annotator: camo_agent:claude-opus-5-5
- id: causal_mosaic:deer_culling_4392
  name: deer culling
  entity_type: management_intervention
  entity_term: deer culling
  state_or_change_qualifier: occurred
  applied_to:
  - entity_type: taxon
    entity_term: NCBITaxon:9874
  source_spans:
  - text: Despite significant and sustained deer herd reductions between 1996 and 2009, which reduced deer densities to 7
      deer km<sup>-2</sup>, there was limited recruitment of small trees and declines in basal area of tree species that were
      sensitive to deer browsing.
    section: abstract
    start_char: 1781
    end_char: 2040
  - text: Our results suggest that recovery from herbivory is a protracted process during which canopy tree regeneration may
      continue to decline despite a reduction in browsing pressure due to deer culling.
    section: abstract
    start_char: 2041
    end_char: 2237
  - text: Densities of small trees (<2 cm DBH) increased by 4.5 times between 1996 and 2009 following deer herd reductions,
      while small to mid-sized trees (2-12 cm DBH) declined by 41% during this period due to previously low abundances of
      small trees in 1996 that moved upwards through the forest canopy (D = 0.25, p < 0.001; Fig. 2B and C).
    section: results
    start_char: 22389
    end_char: 22721
  - text: 'Despite the loss of large trees, mean basal area per individual (±standard error) within comparable plots did not
      change between 1996 and 2009 (1996:  $298 \pm 60 \text{ cm}^2$ ; 2009:  $257 \pm 39 \text{ cm}^2$ ;  $t_{15} = 0.92$
      , p = 0.371), in part due to the growth and increased abundance of smaller trees following deer herd reductions.'
    section: results
    start_char: 23019
    end_char: 23362
  - text: Seedling densities were also lower in 2009, despite deer culling, than when deer densities began to increase in
      1981 ( $t_{14}$  = 4.53, p < 0.001; Fig. 3), but were still greater than in 1996, when no seedlings >50 cm in height
      were
    section: results
    start_char: 24175
    end_char: 24408
  - text: 'Following deer herd reductions (1996–2009), virtually all plots increased along axis 1 and 2 of the ordination
      (14/16 and 15/16 plots, respectively), which were positively associated with a plot-level basal area comprised of species
      that increased in abundance in the presence of deer (correlation between V index and position of plots in ordination
      space: r <sup>2</sup> = 0.63, p = 0.029; n = 15).'
    section: results
    start_char: 25931
    end_char: 26330
  - text: Species that were presumably sensitive to deer browsing, and therefore, increased in abundance only within deer
      exclosures (V > 0), comprised less of the total basal area of plots in 2009 than in 1996 (Fig. 4).
    section: results
    start_char: 26331
    end_char: 26541
  - text: Our study is among the first to demonstrate continued declines in canopy trees despite some understorey regeneration
      during intensive deer herd reductions.
    section: discussion
    start_char: 27608
    end_char: 27763
  - text: This finding suggests that culling alone may only reduce rather than eliminate the negative impacts of high deer
      densities (>10 deer km-2 ) on tree density and composition observed at our site and in many other temperate forests
      ([Putman et al., 1989; Veblen et al., 1989; Husheer et al., 2003;](#page-6-0) [Mountford and Peterken, 2003](#page-6-0)).
    section: discussion
    start_char: 27764
    end_char: 28114
  - text: We observed some recruitment of small trees within forest plots by 2009, suggesting that recovery from herbivory
      may be occurring but is an extremely protracted process.
    section: discussion
    start_char: 29064
    end_char: 29233
  - text: We also report increased tree recruitment during the period of deer herd reductions (1996–2009).
    section: discussion
    start_char: 32627
    end_char: 32723
  annotator: camo_agent:claude-opus-5-5
