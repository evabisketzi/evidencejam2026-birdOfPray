  measured_attribute: Hargreaves climatic moisture deficit
  state_or_change_qualifier: increased
  source_spans:
  - text: On the Ag-field site; however, where competition was also low and the moisture deficit was high ([Figure 1\(](#page-5-0)a)),
      tall seedlings did not grow substantially in height (less than 25 cm over 2 years) compared to the two shorter size
      classes.
    section: discussion
    start_char: 52987
    end_char: 53236
  - text: In this situation, tall size class seedlings had the greatest quantity of leaf area to maintain ([Figure 4](#page-8-0))
      with the lowest relative root mass, potentially placing it at greatest risk of drought and further emphasizing that
      moisture stress can have as much of an impact on seedling development as competing vegetation.
