  entity_type: management_intervention
  entity_term: cutting repeated during the growing season over longer periods, removing tiller apices
  state_or_change_qualifier: occurred
  applied_to:
  - *id002
  - *id003
  source_spans:
  - text: Short-term cutting is likely more effective with one non-native species to be controlled (Rinella
      et al. 2001), when repeated during the growing season, for longer periods of time and when tiller
      apices are removed (Willson & Stubbendieck 1996; Wilson & Clark 2001).
    section: discussion
  annotator: camo_agent:claude-opus-5-5
