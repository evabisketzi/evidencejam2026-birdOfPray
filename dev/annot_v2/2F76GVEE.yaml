  source_spans:
  - text: High GWP at unrestored and dry restored plots largely resulted from large  $CO_2$  effluxes, whereas  $CH_4$  efflux
      contributed more to GWP at wet restored plots.
    section: results
    start_char: 32777
    end_char: 32940
  - text: Given that the GWP of N2O is 298 times that of CO2 on a 100 yr time scale [\(IPCC,](#page-8-0) [2007\),](#page-8-0)
      these fluxes would contribute 18–27 g CO2-e m−<sup>2</sup> yr−<sup>1</sup> to measured GWP, having little effect onmost
      estimated values presented inthis study.
    section: discussion
    start_char: 45183
