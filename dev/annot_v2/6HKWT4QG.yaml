  source_spans:
  - text: The Mulch site had higher soil bulk density and soil temperature compared to the other two sites (Grass and Plow);
      the warmer soil temperature in the Mulch site was likely due to the exposed black plastic mulch warming the ground,
      whereas the other CDC sites had dense coverage of vegetation insulating the soil (Table 2).
    section: results
    start_char: 33791
    end_char: 34113
  - text: Monthly volumetric water content was significantly lower in the Mulch and was highest in the Grass site, with the
