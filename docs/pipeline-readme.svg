<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 688" width="960" height="688" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Pipeline overview</title>
<desc id="d">Six-stage pipeline: 308 markdown articles are preprocessed, species are grounded to NCBITaxon in code, Qwen extracts one compact line per claim, code parses, guards, merges and validates, producing one merged CAMO v0.10.0 graph in YAML and JSON.</desc>

<style>
  :root, svg {
    --bg:#ffffff; --panel:#f6f8fa; --border:#d0d7de; --text:#1f2328; --muted:#59636e; --arrow:#6e7781;
    --llm-fill:#fff1e5; --llm-stroke:#d4762c; --llm-text:#bc4c00;
    --cause-fill:#ddf4ff; --cause:#0969da; --effect-fill:#dafbe1; --effect:#1a7f37; --ok:#1a7f37;
  }
  @media (prefers-color-scheme: dark) {
    :root, svg {
      --bg:#0d1117; --panel:#161b22; --border:#3d444d; --text:#e6edf3; --muted:#9198a1; --arrow:#9198a1;
      --llm-fill:#2a1b0e; --llm-stroke:#db6d28; --llm-text:#f0883e;
      --cause-fill:#0c2a4d; --cause:#58a6ff; --effect-fill:#0f2d1a; --effect:#3fb950; --ok:#3fb950;
    }
  }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: var(--text); }
  .bg { fill: var(--bg); stroke: var(--border); }
  .card { fill: var(--panel); stroke: var(--border); stroke-width: 1.2; }
  .io { fill: none; stroke: var(--border); stroke-width: 1.2; stroke-dasharray: 5 4; }
  .llm { fill: var(--llm-fill); stroke: var(--llm-stroke); stroke-width: 1.6; }
  .rule { stroke: var(--border); stroke-width: 1; }
  .h1 { font-size: 21px; font-weight: 650; }
  .h2 { font-size: 15px; font-weight: 650; }
  .h3 { font-size: 15px; font-weight: 600; }
  .body { font-size: 13px; }
  .small { font-size: 12px; fill: var(--muted); }
  .muted { fill: var(--muted); }
  .note { font-size: 13px; font-style: italic; fill: var(--muted); }
  .big { font-size: 25px; font-weight: 650; }
  .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 12.5px; }
  .llmtext { fill: var(--llm-text); }
  .numc { fill: var(--text); }
  .numc.llmc { fill: var(--llm-stroke); }
  .numt { fill: var(--bg); font-size: 12px; font-weight: 700; }
  .arrow { stroke: var(--arrow); stroke-width: 1.6; fill: none; }
  .ah { fill: var(--arrow); }
  .cause-box { fill: var(--cause-fill); stroke: var(--cause); stroke-width: 1.4; }
  .effect-box { fill: var(--effect-fill); stroke: var(--effect); stroke-width: 1.4; }
  .cause { fill: var(--cause); }
  .effect { fill: var(--effect); }
  .ok { fill: var(--ok); }
  .icon { fill: var(--panel); stroke: var(--muted); stroke-width: 1.4; }
  .iconline { stroke: var(--muted); stroke-width: 1.4; }
  .legend-llm { fill: var(--llm-fill); stroke: var(--llm-stroke); stroke-width: 1.4; }
  .legend-code { fill: var(--panel); stroke: var(--border); stroke-width: 1.4; }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="ah" d="M0,0 L10,5 L0,10 z"/>
  </marker>
</defs>

<rect x="0.5" y="0.5" width="959" height="687" rx="14" class="bg"/>
<text x="24" y="44" class="h1">308 articles in, one merged CAMO graph out</text>
<text x="24" y="66" class="small">One command, six stages. Only stage 3 calls the model.</text>
<rect x="674" y="33" width="14" height="14" rx="3" class="legend-llm"/>
<text x="694" y="45" class="small">LLM call</text>
<rect x="770" y="33" width="14" height="14" rx="3" class="legend-code"/>
<text x="790" y="45" class="small">Deterministic code</text>
<rect x="24" y="92" width="207" height="176" rx="10" class="io"/>
<rect x="111.5" y="122" width="40" height="50" rx="3" class="icon"/>
<rect x="107.5" y="118" width="40" height="50" rx="3" class="icon"/>
<rect x="103.5" y="114" width="40" height="50" rx="3" class="icon"/>
<line x1="110.5" y1="126" x2="136.5" y2="126" class="iconline"/>
<line x1="110.5" y1="133" x2="128.5" y2="133" class="iconline"/>
<line x1="110.5" y1="140" x2="136.5" y2="140" class="iconline"/>
<line x1="110.5" y1="147" x2="128.5" y2="147" class="iconline"/>
<line x1="110.5" y1="154" x2="136.5" y2="154" class="iconline"/>
<text x="127.5" y="202" class="h2" text-anchor="middle">308 articles</text>
<text x="127.5" y="224" class="small" text-anchor="middle" data-maxw="187">markdown converted from PDF</text>
<text x="127.5" y="242" class="small" text-anchor="middle" data-maxw="187">+ index.csv with DOIs</text>
<rect x="259" y="92" width="207" height="176" rx="10" class="card"/>
<circle cx="286" cy="118" r="11" class="numc"/>
<text x="286" y="122.3" class="numt" text-anchor="middle">1</text>
<text x="305" y="123.5" class="h3" data-maxw="145">Preprocess</text>
<line x1="275" y1="139" x2="450" y2="139" class="rule"/>
<text x="275" y="162" class="body" data-maxw="175">Clean PDF artefacts</text>
<text x="275" y="182" class="body" data-maxw="175">Route by section</text>
<text x="275" y="202" class="body" data-maxw="175">Score paragraphs by cues</text>
<text x="275" y="222" class="body" data-maxw="175">Number sentences [n]</text>
<text x="275" y="242" class="body" data-maxw="175">Chunks ≤ 2,500 tokens</text>
<rect x="494" y="92" width="207" height="176" rx="10" class="card"/>
<circle cx="521" cy="118" r="11" class="numc"/>
<text x="521" y="122.3" class="numt" text-anchor="middle">2</text>
<text x="540" y="123.5" class="h3" data-maxw="145">Taxon grounding</text>
<line x1="510" y1="139" x2="685" y2="139" class="rule"/>
<text x="510" y="162" class="body" data-maxw="175">Species legend (T-codes)</text>
<text x="510" y="182" class="body" data-maxw="175">Look up 1,938 verified</text>
<text x="510" y="202" class="body" data-maxw="175">NCBITaxon names</text>
<text x="510" y="222" class="body" data-maxw="175">Unmatched → free text</text>
<text x="510" y="242" class="body" data-maxw="175">LLM never writes an ID</text>
<rect x="729" y="92" width="207" height="176" rx="10" class="llm"/>
<circle cx="756" cy="118" r="11" class="numc llmc"/>
<text x="756" y="122.3" class="numt" text-anchor="middle">3</text>
<text x="775" y="123.5" class="h3 llmtext" data-maxw="145">LLM extraction</text>
<line x1="745" y1="139" x2="920" y2="139" class="rule"/>
<text x="745" y="162" class="body" data-maxw="175">Qwen3.8-27B, thinking off</text>
<text x="745" y="182" class="body" data-maxw="175">T = 0, answers cached</text>
<text x="745" y="202" class="body" data-maxw="175">1 call per chunk</text>
<text x="745" y="222" class="body" data-maxw="175">1 compact line per claim</text>
<text x="745" y="242" class="body" data-maxw="175">Repair call for bad lines</text>
<rect x="24" y="320" width="207" height="176" rx="10" class="card"/>
<circle cx="51" cy="346" r="11" class="numc"/>
<text x="51" y="350.3" class="numt" text-anchor="middle">4</text>
<text x="70" y="351.5" class="h3" data-maxw="145">Parse &amp; expand</text>
<line x1="40" y1="367" x2="215" y2="367" class="rule"/>
<text x="40" y="390" class="body" data-maxw="175">Lenient line parser</text>
<text x="40" y="410" class="body" data-maxw="175">T-code → name + ID</text>
<text x="40" y="430" class="body" data-maxw="175">One edge per effect</text>
<text x="40" y="450" class="body" data-maxw="175">Null → negated</text>
<text x="40" y="470" class="body" data-maxw="175">Hedged → uncertain</text>
<rect x="259" y="320" width="207" height="176" rx="10" class="card"/>
<circle cx="286" cy="346" r="11" class="numc"/>
<text x="286" y="350.3" class="numt" text-anchor="middle">5</text>
<text x="305" y="351.5" class="h3" data-maxw="145">Guard &amp; merge</text>
<line x1="275" y1="367" x2="450" y2="367" class="rule"/>
<text x="275" y="390" class="body" data-maxw="175">Per-edge JSON Schema</text>
<text x="275" y="410" class="body" data-maxw="175">Drop bad optional fields</text>
<text x="275" y="430" class="body" data-maxw="175">Fix predicate / language</text>
<text x="275" y="450" class="body" data-maxw="175">Deduplicate edges</text>
<text x="275" y="470" class="body" data-maxw="175">All 308 source docs</text>
<rect x="494" y="320" width="207" height="176" rx="10" class="card"/>
<circle cx="521" cy="346" r="11" class="numc"/>
<text x="521" y="350.3" class="numt" text-anchor="middle">6</text>
<text x="540" y="351.5" class="h3" data-maxw="145">Write &amp; validate</text>
<line x1="510" y1="367" x2="685" y2="367" class="rule"/>
<text x="510" y="390" class="body" data-maxw="175">YAML + JSON</text>
<text x="510" y="410" class="body" data-maxw="175">JSON Schema check</text>
<text x="510" y="430" class="body" data-maxw="175">linkml-validate</text>
<text x="510" y="450" class="body" data-maxw="175">A failing paper never</text>
<text x="510" y="470" class="body" data-maxw="175">stops the run</text>
<rect x="729" y="320" width="207" height="176" rx="10" class="io"/>
<line x1="810.5" y1="354" x2="844.5" y2="344" class="iconline"/>
<line x1="810.5" y1="354" x2="832.5" y2="372" class="iconline"/>
<line x1="844.5" y1="344" x2="832.5" y2="372" class="iconline"/>
<line x1="832.5" y1="372" x2="816.5" y2="386" class="iconline"/>
<line x1="832.5" y1="372" x2="854.5" y2="380" class="iconline"/>
<line x1="844.5" y1="344" x2="854.5" y2="380" class="iconline"/>
<circle cx="810.5" cy="354" r="5" class="icon"/>
<circle cx="844.5" cy="344" r="5" class="icon"/>
<circle cx="832.5" cy="372" r="6" class="icon"/>
<circle cx="816.5" cy="386" r="5" class="icon"/>
<circle cx="854.5" cy="380" r="5" class="icon"/>
<text x="832.5" y="424" class="h2" text-anchor="middle">Merged CAMO graph</text>
<text x="832.5" y="446" class="small" text-anchor="middle">schema v0.10.0</text>
<text x="832.5" y="464" class="small" text-anchor="middle">YAML + JSON</text>
<text x="832.5" y="482" class="small" text-anchor="middle" data-maxw="187">one source doc per article</text>
<path d="M234,180.0 L255,180.0" class="arrow" marker-end="url(#ah)"/>
<path d="M234,408.0 L255,408.0" class="arrow" marker-end="url(#ah)"/>
<path d="M469,180.0 L490,180.0" class="arrow" marker-end="url(#ah)"/>
<path d="M469,408.0 L490,408.0" class="arrow" marker-end="url(#ah)"/>
<path d="M704,180.0 L725,180.0" class="arrow" marker-end="url(#ah)"/>
<path d="M704,408.0 L725,408.0" class="arrow" marker-end="url(#ah)"/>
<path d="M832.5,271 L832.5,294 L127.5,294 L127.5,316" class="arrow" marker-end="url(#ah)"/>
<text x="480.0" y="532" class="note" text-anchor="middle" data-maxw="912">Design principle: the model only reads the text; everything that can be checked mechanically is done in code.</text>
<rect x="24.0" y="554" width="172.8" height="86" rx="10" class="card"/>
<text x="40.0" y="588" class="big" data-maxw="140.8">308</text>
<text x="40.0" y="610" class="small" data-maxw="140.8">papers processed</text>
<text x="40.0" y="627" class="small" data-maxw="140.8">0 failed</text>
<rect x="208.8" y="554" width="172.8" height="86" rx="10" class="card"/>
<text x="224.8" y="588" class="big" data-maxw="140.8">30,208</text>
<text x="224.8" y="610" class="small" data-maxw="140.8">edges in the</text>
<text x="224.8" y="627" class="small" data-maxw="140.8">merged graph</text>
<rect x="393.6" y="554" width="172.8" height="86" rx="10" class="card"/>
<text x="409.6" y="588" class="big" data-maxw="140.8">0</text>
<text x="409.6" y="610" class="small" data-maxw="140.8">schema errors</text>
<text x="409.6" y="627" class="small" data-maxw="140.8">JSON Schema, LinkML</text>
<rect x="578.4" y="554" width="172.8" height="86" rx="10" class="card"/>
<text x="594.4" y="588" class="big" data-maxw="140.8">11.6k</text>
<text x="594.4" y="610" class="small" data-maxw="140.8">tokens per paper</text>
<text x="594.4" y="627" class="small" data-maxw="140.8">9.3k in + 2.3k out</text>
<rect x="763.2" y="554" width="172.8" height="86" rx="10" class="card"/>
<text x="779.2" y="588" class="big" data-maxw="140.8">0.579*</text>
<text x="779.2" y="610" class="small" data-maxw="140.8">Murphy (2005) F1</text>
<text x="779.2" y="627" class="small" data-maxw="140.8">standard, 3-run mean</text>
<text x="24" y="666" class="small" data-maxw="912">* Development score from the team's own scorer (standard edge matching vs. the human-annotated Murphy 2005 gold). Not the judges' score.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
