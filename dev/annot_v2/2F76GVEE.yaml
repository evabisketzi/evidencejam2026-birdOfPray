  state_or_change_qualifier: increased
  source_spans:
  - text: On the other hand, the present study highlights the importance of vascular plants, particularly graminoid cover
      in this case, for carbon sequestration.
    section: discussion
    start_char: 41544
    end_char: 41695
  - text: Thus, while a return to long-term ecohydrological function of restored peatlands, particularly bogs, likely requires
