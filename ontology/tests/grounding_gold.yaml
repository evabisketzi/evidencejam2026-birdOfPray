#   expect: null   -> must NOT be auto-resolved (free text, or a decision for the LLM)
# Taxa come from the hand-checked example/Murphy2005.yaml. The other entries were checked
# against the ontology labels on 2026-11-14 (the term means the same as the label); they test
# the plumbing, and should be extended with hand-checked terms from corpus articles.

