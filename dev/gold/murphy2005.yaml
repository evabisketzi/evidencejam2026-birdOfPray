- finding_id: f1
  sentence: In a field additive-series experiment in a degraded woodlot near Waterloo,
    Ontario, as of 2000 (transplanted 1997, with initial Alliaria petiolata densities
    of 128 seedlings/m2 and 31 rosettes/m2), initial Sanguinaria canadensis densities
    of as little as 5 ramets/m2 suppressed Alliaria petiolata, as shown by multivariate
    repeated-measures ANOVA and simple ANOVAs.
  fit: lossy
  graph:
    graph_id: 567f2b10444a436096aa9c37e6e471e4-f1
