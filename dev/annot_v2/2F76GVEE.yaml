- id: causal_mosaic:water_table_position_8e41
  name: water table position
  entity_type: environmental_variable
  entity_term: water table
  measured_attribute: mean water table position
  state_or_change_qualifier: increased
  source_spans:
  - text: Carbon dioxide exchange was correlated to vascular vegetation cover that varied depending on local water table position.
    section: abstract
    start_char: 1683
    end_char: 1803
  - text: Water table was also related to CH4 flux, with higher emissions from wet sites.
    section: abstract
    start_char: 1804
    end_char: 1883
  - text: Water table position was significantly positively related to graminoid cover (linear regression, R2(adj) = 0.43,
      p = 0.012) but was not a significant predictor of total plant cover, total vascular cover, moss cover or shrub cover.
    section: results
    start_char: 23142
    end_char: 23372
  - text: Comparing wet and dry restored plots, moss and shrub cover was generally higher in dry restored plots, while total
      vascular plant cover and graminoid cover was higher in wet restored plots.
    section: results
    start_char: 23373
    end_char: 23562
  - text: However, only graminoid cover was statistically significantly different between wet and dry restored plots (t-test,
      T = −3.36, p = 0.007).
    section: results
    start_char: 23563
    end_char: 23701
  - text: In both cases, the unrestored site was significantly different from the restored site, while wet and dry restored
      plots were different for GEP<sub>max</sub>, but not statistically significantly different for NEE<sub>max</sub> (p=0.06).
    section: results
    start_char: 24946
    end_char: 25181
  - text: Dry restored plots were not statistically significantly different from either wet restored or unrestored plots (Fig.
      2).
    section: results
    start_char: 25348
    end_char: 25468
  - text: Combining all sites and using mean growing season values of  $CO_2$  exchange and water table position,  $GEP_{max}$  (Fig.
      3b) and  $NEE_{max}$  were both significantly related to water table (linear regression, p < 0.05).
    section: results
    start_char: 25470
    end_char: 25693
  - text: Wet restored plots had significantly higher CH<sub>4</sub> flux than dry restored plots (Mann–Whitney, p = 0.006).
    section: results
    start_char: 28407
    end_char: 28521
  - text: Mean seasonal CH<sub>4</sub> flux varied with water table with log (total season CH<sub>4</sub> flux + 1) increasing
      as mean season water table position became shallower (Fig. 5;  $R^2$ (adj)=0.25, p=0.057).
    section: results
    start_char: 28523
    end_char: 28730
  - text: Graminoid cover accounted for a large proportion of total plant cover and was correlated to water table position,
      and this was likely an important driver for the relationship between water table and CO2 exchange [\(Fig.](#page-4-0)
      3).
    section: discussion
    start_char: 43401
    end_char: 43636
  - text: However, [Chimner](#page-8-0) [and](#page-8-0) [Cooper](#page-8-0) [\(2003\)](#page-8-0) report water table control
      on graminoid net primary productivity in a mountain fen suggesting that shallow water table is also likely to result
      in higher GEP once plants are established.
    section: discussion
    start_char: 43637
    end_char: 43912
  - text: Water table also largely controls CH4 flux (this study, [Couwenberg](#page-8-0) [and](#page-8-0) [Fritz,](#page-8-0)
      [2012\)](#page-8-0) and thus, while wet restored sites were larger seasonal sinks for CO2, they were also much larger
      sources of CH4.
    section: discussion
    start_char: 43913
    end_char: 44163
  - text: Water table position on the restored peatland was well correlated to both CO2 and CH4 flux.
    section: conclusion
    start_char: 48711
    end_char: 48802
  - text: Graminoid cover was positively correlated to water table resulting in wetter sites having higher graminoid cover
      while often also having higher vascular plant and total plant cover in general, and thus higher rates of net CO2 uptake.
    section: conclusion
    start_char: 48803
    end_char: 49036
  - text: On the other hand, some of the wettest plots were also very large sources of CH4.
    section: conclusion
    start_char: 49037
    end_char: 49118
  annotator: camo_agent:claude-opus-5-5
