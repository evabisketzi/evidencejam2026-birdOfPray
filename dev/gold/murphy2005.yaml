- finding_id: f20
  sentence: The numbers of stem leaves, gross leaf area, number of flowers, number
    of siliques, and height at final flowering of Alliaria petiolata were all significantly
    suppressed by Sanguinaria canadensis at intermediate and higher initial densities
    of 7, 9, 11, 15, and 20 ramets/m2, indicating density-dependent competition from
    S. canadensis had a significant effect on Alliaria petiolata.
