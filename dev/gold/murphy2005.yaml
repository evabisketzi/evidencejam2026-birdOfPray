  sentence: There were no differences between Sanguinaria canadensis density treatments
    in the numbers of autumn Alliaria petiolata seedlings that emerged during summer
    or in the change in numbers of seedlings between late spring and autumn, because
    S. canadensis leaves senesced by summer and the Alliaria petiolata seed bank is
    large.
