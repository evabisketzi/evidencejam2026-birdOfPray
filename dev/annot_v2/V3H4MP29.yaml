  state_or_change_qualifier: increased
  life_stage_term: eggs
  source_spans:
  - text: Egg deposition was lowest in Lake Michigan (0.4–154.5 eggs•m*–*2, median = 1.7), intermediate in Parry Sound (39–1,027
      eggs•m–2, median = 278), and highest in Lake Champlain (0.001–9,623 eggs•m–2, median = 652).
    section: abstract
    start_char: 1554
    end_char: 1765
  - text: Across all sampling years, egg densities were the lowest in Lake Michigan (0.4–154.5 eggs•m–2), intermediate in
      Parry Sound (39–1,027 eggs•m–2), and highest overall in Lake Champlain but with higher variation among sites (0.001–9,623
      eggs•m–2; Table 3).
    section: results
    start_char: 37245
    end_char: 37498
  - text: The line of bags set across the contour at Whallon Bay in Lake Champlain collected 709 eggs; the bags at either
      end of the line had few (< 15 per bag) or no eggs, whereas the bags in the center of the line, at the top of the reef
      slope, contained the most eggs (45 to 243 eggs per bag).
    section: results
    start_char: 38115
    end_char: 38401
  - text: Overall, we found that the proportion of reefs visited by lake trout, number of adult lake trout, density of eggs
      deposited, and number of fry hatched were highest in Lake Champlain, intermediate in Lake Huron, and the lowest in Lake
      Michigan.
    section: discussion
    start_char: 48232
    end_char: 48475
  - text: More artificial sites than natural sites (6 versus 3) were used by spawning lake trout in Lake Champlain, and the
      only artificial site investigated in Lake Michigan produced the highest egg densities (LTB crib).
    section: discussion
    start_char: 57882
    end_char: 58093
  - text: The highest densities of eggs and fry were recovered from the smallest sites in lakes Champlain and Michigan.
    section: discussion
    start_char: 58143
    end_char: 58252
  - text: It is possible that smaller sites concentrated spawning activity and eggs.
    section: discussion
    start_char: 58344
    end_char: 58418
  - text: Catches of adult lake trout in gillnets, while small, confirmed the patterns observed for egg deposition; the highest
      numbers were captured in Lake Champlain and no lake trout were captured in Lake Michigan surveys.
    section: discussion
    start_char: 58420
    end_char: 58635
  - text: The distribution of egg collections in the crosscontour line of egg bags at Whallon Bay, Lake Champlain, confirms
      Perkins and Krueger's (1995) observation that eggs tend to be deposited at the edge of the downward slope.
