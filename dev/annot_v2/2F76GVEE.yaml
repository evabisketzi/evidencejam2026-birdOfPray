nodes:
- id: causal_mosaic:peatland_restoration_f64c
  name: peatland restoration
  entity_type: management_intervention
  entity_term: peatland restoration
  state_or_change_qualifier: occurred
  source_spans:
  - text: Restoration resulted in a shiftin mean growing season fluxes from 378 g CO2 C and −0.2 g CH4 C at the unrestored
      site to −30 g CO2 C and 3.7 g CH4 C at the restored site, where positive values indicate flux of carbon from the peatland
      to the atmosphere.
    section: abstract
    start_char: 1429
    end_char: 1682
  - text: While the restored site soil thawed by late June 2012, the frost table remained within the upper 70 cm at the unrestored
      site into the July sampling date in 2012.
    section: results
    start_char: 22568
    end_char: 22730
  - text: 'Both GEPmax and NEEmax were significantly different between sites (GEPmax: df = 2, F=16.15, p<0.001; NEE: df=2,
      F=14.55, p=0.001).'
    section: results
  - text: In both cases, the unrestored site was significantly different from the restored site, while wet and dry restored
      plots were different for GEP<sub>max</sub>, but not statistically significantly different for NEE<sub>max</sub> (p=0.06).
    section: results
    start_char: 24946
    end_char: 25181
  - text: Ecosystem respiration was also significantly different between sites (df=2, F=5.56, p=0.02) with wet restored plots
      being significantly higher than unrestored plots.
    section: results
    start_char: 25182
    end_char: 25347
  - text: Dry restored plots were not statistically significantly different from either wet restored or unrestored plots (Fig.
      2).
    section: results
    start_char: 25348
    end_char: 25468
  - text: Methane flux was significantly different between sites (Fig. 2; Kruskal–Wallis, df = 2, H = 10.71, p = 0.005).
    section: results
    start_char: 27999
    end_char: 28109
  - text: Pairwise comparison indicated that the unrestored site CH<sub>4</sub> flux was not significantly different from
      dry restored (Mann–Whitney, p = 0.11) or wet restored sites (Mann–Whitney, p = 0.04) although the latter is likely due
      only to the low number of replicate plots at the unrestored site.
    section: results
    start_char: 28110
    end_char: 28406
  - text: Restored plots acted as both sources and sinks of carbon at both dry and wet restored plots, although the average
      across all restored plots was a net sink.
    section: results
  - text: The present study supports these trends with restoration resulting in a shift in mean growing season net CO<sub>2</sub>
      and CH<sub>4</sub> fluxes from 378 g CO<sub>2</sub>—C and -0.2 g CH<sub>4</sub>—C at the unrestored site to -30 g CO<sub>2</sub>—C
      and 3.7 g CH<sub>4</sub>—C at the restored site.
    section: discussion
    start_char: 33698
    end_char: 33997
  - text: While on average restoration reduced GWP from CO2 and CH4 at both dry and wet restored plots, both very dry and
      very wet plots remained GHG sources due to continued high emissions of CO2 (dry sites) or high CH4 efflux (wet sites).
    section: discussion
    start_char: 44364
    end_char: 44594
  - text: Application of methods outlined in the North American Restoration Guide [\(Quinty](#page-8-0) [and](#page-8-0) [Rochefort,](#page-8-0)
      [2003\)](#page-8-0) to a cutover peatland in the Western Boreal Plain Ecozone in Alberta, Canada resulted in a switch
      from a large growing season CO2 source on unrestored plots to a growing season CO2 sink 3 yr following restoration.
    section: conclusion
    start_char: 47930
    end_char: 48298
  - text: Restoration also resulted in a shift from a small CH4 sink to a CH4 source of 3.7 g CH4 C m−<sup>2</sup> over the
      growing season.
    section: conclusion
    start_char: 48299
    end_char: 48428
  - text: Plant cover increased post restoration with mean moss and vascular cover of restored plots of 27% and 57%, respectively.
    section: conclusion
    start_char: 48429
    end_char: 48549
  annotator: camo_agent:claude-opus-5-5
