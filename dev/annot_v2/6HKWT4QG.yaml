    entity_term: forbs
  source_spans:
  - text: At the Plow and Well-site, surface site preparation occurring just prior to outplanting allowed seedlings to respond
      to competition control in just the first year.
    section: methods
    start_char: 20753
    end_char: 20916
  - text: Reducing competing vegetation before outplanting improved height growth, particularly in seedlings with high root-to-shoot
      ratios.
