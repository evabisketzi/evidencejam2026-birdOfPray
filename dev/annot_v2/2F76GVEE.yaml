  measured_attribute: GEPmax
  state_or_change_qualifier: increased
  source_spans:
  - text: 'Both GEPmax and NEEmax were significantly different between sites (GEPmax: df = 2, F=16.15, p<0.001; NEE: df=2,
      F=14.55, p=0.001).'
    section: results
  - text: In both cases, the unrestored site was significantly different from the restored site, while wet and dry restored
      plots were different for GEP<sub>max</sub>, but not statistically significantly different for NEE<sub>max</sub> (p=0.06).
    section: results
    start_char: 24946
    end_char: 25181
  - text: Combining all sites and using mean growing season values of  $CO_2$  exchange and water table position,  $GEP_{max}$  (Fig.
      3b) and  $NEE_{max}$  were both significantly related to water table (linear regression, p < 0.05).
    section: results
    start_char: 25470
    end_char: 25693
  - text: Ecosystem respiration was significantly related to  $GEP_{max}$  (Fig. 3c, linear regression,  $R^2(adj) = 0.67$
      , p < 0.001).
    section: results
    start_char: 25694
    end_char: 25820
  - text: The correlation between ER and  $GEP_{max}$  was further supported by a significant linear regression between ER
      and vascular plant cover (Fig. 4,  $R^2(adj) = 0.28$ , p = 0.024).
    section: results
    start_char: 26092
    end_char: 26271
  - text: Vascular plant cover was also a significant predictor of  $log(GEP_{max})$  (Fig. 4, linear regression,  $R^2(adj)
      = 0.49$ , p = 0.007).
    section: results
    start_char: 26272
    end_char: 26408
  - text: Graminoid cover was also significantly related to  $log(GEP_{max})$  ( $R^2(adj) = 0.47$ , p = 0.008).
    section: results
    start_char: 26409
    end_char: 26511
  - text: However, [Chimner](#page-8-0) [and](#page-8-0) [Cooper](#page-8-0) [\(2003\)](#page-8-0) report water table control
      on graminoid net primary productivity in a mountain fen suggesting that shallow water table is also likely to result
      in higher GEP once plants are established.
    section: discussion
    start_char: 43637
    end_char: 43912
