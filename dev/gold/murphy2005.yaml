- finding_id: f13
  sentence: The increase in the number of leaves of Sanguinaria canadensis at initial
    intermediate densities of 9 and 11 ramets/m2 to levels equal to or near that at
    the highest initial density of 20 ramets/m2 indicates that these intermediate
    densities were most useful in competing with Alliaria petiolata, though this one
    measure is not a substitute for a complete response surface test of intra- and
    interspecific competition.
