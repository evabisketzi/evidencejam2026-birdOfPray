  annotator: camo_agent:claude-opus-5-5
- id: causal_mosaic:canopy_tree_regeneration_f0ed
  name: canopy tree regeneration
  entity_type: composite_variable
  entity_term: canopy trees
  measured_attribute: regeneration
  state_or_change_qualifier: decreased
  source_spans:
  - text: A lack of canopy tree regeneration has begun to shift the forest at our site towards an open-canopy ecosystem, the
      most phytosociologically-similar of which is oak savanna (Curtis, 1959; Tester, 1989; Peterson and Reich, 2001; Brudvig
      and Asbjornsen, 2007).
    section: discussion
    start_char: 33460
    end_char: 33717
  annotator: camo_agent:claude-opus-5-5
- id: causal_mosaic:canopy_tree_density_b4e1
  name: canopy tree density
  entity_type: composite_variable
  entity_term: canopy trees
  measured_attribute: density
  state_or_change_qualifier: decreased
  source_spans:
  - text: Large declines in canopy-tree densities in Carolinian forests may lead to forest size-structures and herbaceous
      plant communities that resemble rare oak savanna habitat, creating difficult decisions for conservation managers aiming
      to protect rare and endangered species within native ecosystems.
    section: abstract
    start_char: 2238
    end_char: 2534
  - text: Our study is among the first to demonstrate continued declines in canopy trees despite some understorey regeneration
      during intensive deer herd reductions.
    section: discussion
    start_char: 27608
    end_char: 27763
  - text: Reductions in small trees associated with high deer densities can have cascading effects into larger size classes
      over time, leading to continual declines in canopy trees without any regeneration even when browse pressures are removed.
    section: discussion
    start_char: 28115
    end_char: 28350
  - text: Declines in canopy tree density that enlarge canopy gaps or reduce canopy tree height may further increase wind
      speeds ([Tanentzap et al., 2007; Vygodskaya et al., 2007; Panferov and](#page-6-0) [Sogachev, 2008](#page-6-0)), and
      thus act as a positive feedback to further increase the susceptibility of large-sized trees to windthrow ([Canham et
      al., 2001](#page-5-0)).
    section: discussion
    start_char: 28351
    end_char: 28720
  - text: Reductions in canopy-tree densities deplete seed sources and may strongly limit the potential for increased seedling
      and sapling densities following deer culling.
    section: discussion
    start_char: 28900
    end_char: 29062
  annotator: camo_agent:claude-opus-5-5
- id: causal_mosaic:decline_in_canopy_tree_densities_0551
