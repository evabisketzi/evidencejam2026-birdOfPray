  measured_attribute: regeneration
  state_or_change_qualifier: increased
  source_spans:
  - text: Our results suggest that recovery from herbivory is a protracted process during which canopy tree regeneration may
      continue to decline despite a reduction in browsing pressure due to deer culling.
    section: abstract
    start_char: 2041
    end_char: 2237
  - text: We recommend that managers protect Carolinian forest stands and encourage canopy tree regeneration by increasing
      seed sources of native trees.
    section: abstract
    start_char: 2535
    end_char: 2677
  - text: Reductions in small trees associated with high deer densities can have cascading effects into larger size classes
      over time, leading to continual declines in canopy trees without any regeneration even when browse pressures are removed.
    section: discussion
    start_char: 28115
