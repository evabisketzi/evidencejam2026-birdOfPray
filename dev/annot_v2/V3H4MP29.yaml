  state_or_change_qualifier: decreased
  life_stage: reproductive_adult
  life_stage_term: spawning adults
  source_spans:
  - text: Lake trout restoration appears unlikely in northern Lake Michigan at current adult densities, and failure of restoration
      in Lake Champlain suggests that there are sources of high mortality that occur after fry emergence.
    section: abstract
    start_char: 2129
    end_char: 2349
  - text: If we use Parry Sound as a benchmark for successful restoration of trout, the low use of spawning reefs in northern
      Lake Michigan indicates that the density of spawning lake trout is too low to support natural recruitment (Bronte *et
      al.* 2003a, 2003b).
    section: discussion
    start_char: 64968
    end_char: 65221
