- id: causal_mosaic:increased_latewood_xylem_anomaly_frequency_in_picea_glauca_209f
  name: Increased latewood xylem anomaly frequency in Picea glauca
  entity_type: taxon
  entity_term: NCBITaxon:3330
  measured_attribute: latewood anomaly frequency
  state_or_change_qualifier: increased
  life_stage: mixed_or_whole_population
  annotator: camo_agent:claude-opus-5-5
  source_spans:
  - text: By contrast, provenances from southern regions with longer and warmer growing conditions showed an increased presence
      of latewood anomalies. These southern populations showed thin and unlignified cell walls in years when cold temperatures
      arrived before they could finish the last stages of xylem formation, indicating a potential maladaptation to the shorter
      growing seasons in the study site.
    section: conclusion
    start_char: 30920
    end_char: 31314
- id: causal_mosaic:increased_overall_xylem_anomaly_frequency_in_picea_glauca_eeb1
  name: Increased overall xylem anomaly frequency in Picea glauca
  entity_type: taxon
  entity_term: NCBITaxon:3330
  measured_attribute: overall xylem anomaly frequency
  state_or_change_qualifier: increased
  life_stage: mixed_or_whole_population
  annotator: camo_agent:claude-opus-5-5
  source_spans:
  - text: Local provenances collected near the planting site showed the least overall amount of xylem anomalies. This indicates
      that they are correctly adapted to the environment in which they occur, and that xylem anomalies should be at a minimum
      when planting stock is correctly matched to their optimal growing conditions.
    section: conclusion
    start_char: 30603
    end_char: 30918
