  source_corpus: 'Single article: Stover, Naeth & Wilkinson 2017, Applied Vegetation Science 20(4)'
  project: EcoWeaver
source_documents:
- document_id: 10.1111/avsc.12316
  doi: 10.1111/avsc.12316
  title: Glyphosate, steam and cutting for non-native plant control in Alberta fescue grassland restoration
  authors:
  - Holly J. Stover
  - M. Anne Naeth
  - Sarah R. Wilkinson
  year: 2017
  journal: Applied Vegetation Science
  study_coordinates:
  - latitude: 49.0517
    longitude: -113.9142
    elevation_m: 1280
    coordinate_uncertainty_m: 10000
    coordinate_location_basis:
    - nearest_municipality
    geodetic_datum: WGS84
  study_country: CA
  study_state_or_province: Alberta
  study_period_start: 2010-07
  study_period_end: 2013-08
  study_temporal_note: Baseline vegetation July 2010; treatments late July 2010 and May-June 2011; seeding
    June 2011 and transplanting June 2012 in all plots; assessments late July/early August 2011-2013;
    soils sampled September 2011. Coordinates are Waterton Park townsite (the paper gives none; sites
    lie within a 3-km radius of each other in Waterton Lakes National Park).
  study_design: randomized_experiment
  sample_size_value: 33
  sample_size_unit: plots
  sampling_effort_protocol: 'Randomized incomplete block design: 3 sites (blocks) of 0.3 ha, each in 12
    plots, with cutting, glyphosate, steam and control randomly assigned to 3 plots each (no steam at
    Site 2, so 33 treated or control plots); ten 0.1-m2 quadrats on two transects per plot; ocular canopy
    cover by species; analysed by site (one-way ANOVA in proc mixed, Tukey), paired t-tests 2010 vs 2013,
    NMDS with Spearman correlations, MRPP and indicator species analysis; plus an undisturbed reference
    plot per site'
  is_sampling_effort_reported: true
nodes:
- id: causal_mosaic:broadcast_glyphosate_application_not_species_targeted_1578
  name: Broadcast glyphosate application (not species-targeted)
  entity_type: management_intervention
  entity_term: broadcast glyphosate application without species targeting (Roundup; July 2010 and May
    2011)
  state_or_change_qualifier: occurred
  applied_to: &id001
  - entity_type: composite_variable
    entity_term: non-native grasses
  - entity_type: composite_variable
    entity_term: non-native forbs
  source_spans:
  - text: Glyphosate reduced non-native grass cover for three growing seasons following application and
      non-native forbs for one growing season.
    section: abstract
  - text: Non-native grass cover with glyphosate was 75% less than the control at Site 2 in 2012, and
      50% at Site 1 and 84% at Site 2 in 2013.
    section: results
  annotator: camo_agent:claude-opus-5-5
- id: causal_mosaic:cutting_of_vegetation_two_annual_cuts_e37e
  name: Cutting of vegetation (two annual cuts)
  entity_type: management_intervention
  entity_term: cutting with handheld grass trimmers, cuttings left in place (July 2010, June 2011)
  state_or_change_qualifier: occurred
  applied_to: *id001
  source_spans:
  - text: Flowering and seed set of non-native grasses was significantly reduced with glyphosate at Site
      1, and that of nonnative forbs was significantly reduced with cutting and glyphosate at Site 2 (Fig.
      3).
    section: results
  - text: Cutting and steam did not change plant community structure relative to the control.
    section: results
  annotator: camo_agent:claude-opus-5-5
- id: causal_mosaic:steam_application_to_vegetation_fb17
  name: Steam application to vegetation
  entity_type: management_intervention
  entity_term: commercial hot-water steam application (325 °C/800 psi 2010; 225 °C/350 psi 2011)
  state_or_change_qualifier: occurred
  applied_to: *id001
  source_spans:
  - text: Cutting and steam did not change plant community structure relative to the control.
    section: results
  - text: They did not reduce non-native grass and forb cover relative to controls within a year (Fig.
      1), although over 3 yr, non-native grass cover was significantly lower with steam at Site 1 and
      with cutting at Site 3 (Fig. 2).
    section: results
  annotator: camo_agent:claude-opus-5-5
- id: causal_mosaic:non_native_plant_management_treatment_cutting_glyphosate_or__5959
  name: Non-native plant management treatment (cutting, glyphosate or steam)
  entity_type: management_intervention
  entity_term: non-native plant management treatments tested (cutting, glyphosate, steam)
  state_or_change_qualifier: occurred
  applied_to: *id001
  source_spans:
  - text: At Site 3, treatment had no effect on non-native plant flowering and seed production, although
      it significantly reduced that of native grasses and forbs.
    section: results
  - text: No treatment effectively re-established native grassland communities.
    section: abstract
  annotator: camo_agent:claude-opus-5-5
- id: causal_mosaic:early_spring_herbicide_application_to_establishing_non_nativ_88d3
  name: Early spring herbicide application to establishing non-native grasses
  entity_type: management_intervention
  entity_term: two early spring herbicide applications timed to grass establishment
  state_or_change_qualifier: occurred
  applied_to:
  - &id002
    entity_type: taxon
    entity_term: NCBITaxon:4479
  - &id003
    entity_type: composite_variable
    entity_term: non-native grasses
  source_spans:
  - text: Two early spring herbicide applications when grasses were establishing and putting resources
      into shoot production may reduce non-native grasses more with less harm to native forbs than in
      July when grasses, and forbs, are at peak production.
    section: discussion
  annotator: camo_agent:claude-opus-5-5
- id: causal_mosaic:follow_up_herbicide_spraying_of_non_native_forbs_replacing_c_6f8d
  name: Follow-up herbicide spraying of non-native forbs replacing controlled grasses
  entity_type: management_intervention
  entity_term: follow-up herbicide treatment targeting establishing non-native forbs
  state_or_change_qualifier: occurred
  applied_to:
  - entity_type: composite_variable
    entity_term: non-native forbs
  source_spans:
  - text: Spraying the dominant grasses in spring with follow-up spraying to manage non-native forbs that
      establish and replace these grasses later in the growing season could be an effective management
      technique, although caution must be taken to protect native forbs.
    section: discussion
  annotator: camo_agent:claude-opus-5-5
- id: causal_mosaic:repeated_herbicide_application_every_2_3_years_5594
