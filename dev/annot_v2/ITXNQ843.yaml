  state_or_change_qualifier: occurred
  applied_to: *id001
  source_spans:
  - text: At Site 3, treatment had no effect on non-native plant flowering and seed production, although it significantly
      reduced that of native grasses and forbs.
    section: results
    start_char: 19567
    end_char: 19720
  - text: No treatment effectively re-established native grassland communities.
