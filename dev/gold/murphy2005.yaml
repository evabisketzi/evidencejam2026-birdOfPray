- finding_id: f3
  sentence: The experiments indicated that transplanting Sanguinaria canadensis was
    effective at mitigating the spread of Alliaria petiolata, although it remains
    to be tested whether this will continue and whether reestablishment of S. canadensis
    will help reassemble forest ecosystems.
  fit: lossy
  graph:
    graph_id: 567f2b10444a436096aa9c37e6e471e4-f3
