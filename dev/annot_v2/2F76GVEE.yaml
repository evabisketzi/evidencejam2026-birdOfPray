  entity_term: global warming potential
  measured_attribute: GWP from CO2 and CH4 exchange
  source_spans:
  - text: Plotting GWP based on CO2 and CH4 flux against mean seasonal water table results in a unimodal relationship (Fig.
      6) that suggests that GHG sink at this site is optimized when water table is 17 cm below the surface.
    section: discussion
    start_char: 46361
    end_char: 46576
  - text: When only restored plots are included, the relationship is no longer statistically significant, but suggests an
      optimum water table of 28 cm below the surface.
    section: discussion
    start_char: 46577
    end_char: 46736
  annotator: camo_agent:claude-opus-5-5
