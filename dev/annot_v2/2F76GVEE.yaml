  study_period_start: '2011-07-13'
  study_period_end: '2012-07-21'
  study_temporal_note: Cutover peatland north of Wandering River, restored in 2008 (North American Peatland Restoration Guide).
    CO2 and CH4 fluxes measured 13 Jul-9 Sep 2011 and 16 May-21 Jul 2012; vegetation survey August 2012.
  study_design: quasi_experiment
