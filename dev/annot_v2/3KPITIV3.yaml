    coordinate_location_basis:
    - exact_site
    geodetic_datum: WGS84
  study_country: CA
  study_state_or_province: Alberta
  study_period_start: '1982'
  study_period_end: '2017'
  study_temporal_note: Provenance trial planted 1982 with 4-year-old seedlings; increment cores collected summer 2017; ring
    years 1983-2016 analysed. Site climate 1982-2016 and origin climate (1961-1990 normals) from ClimateNA v5.21.
  study_design: randomized_experiment
  sample_size_value: 115
  sample_size_unit: increment cores (one tree each)
  sampling_effort_protocol: 24 of 43 provenances (six ecozones) in a randomized complete block design (5 blocks, five-tree
    row plots, 2.5 x 2.5 m); one 5-mm core at ~50 cm height from one tree of average height and DBH per row plot; 5 of 120
    cores excluded for quality; 15-20 um microtome sections double-stained with safranin and astra blue, scored at 100x and
    200x by a single observer
  is_sampling_effort_reported: true
