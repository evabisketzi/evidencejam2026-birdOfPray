  state_or_change_qualifier: occurred
  applied_to: *id001
  source_spans:
  - text: We only recommend this for heavily invaded sites, and suggest spot spraying may be a less detrimental
      alternative for native species.
    section: discussion
  annotator: camo_agent:claude-opus-5-5
- id: causal_mosaic:repeated_within_season_cutting_that_removes_tiller_apices_6fa6
