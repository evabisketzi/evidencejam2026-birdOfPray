nodes:
- id: causal_mosaic:white_tailed_deer_density_8051
  name: white-tailed deer density
  entity_type: taxon
  entity_term: NCBITaxon:9874
  measured_attribute: density
  state_or_change_qualifier: increased
  life_stage: mixed_or_whole_population
  source_spans:
  - text: We recorded declines in all tree size classes between 1981 and 1996, during which densities of whitetailed deer
      (Odocoileus virginianus) reached a peak of 55 deer km<sup>-2</sup>.
    section: abstract
    start_char: 1601
    end_char: 1780
  - text: Small trees (<6 cm DBH) were 72% less frequent within plots in 1996 after 19-years of >30 deer km<sup>-2</sup> than
      in 1981 when deer densities first began to increase, leading to changes in forest size structure (D = 0.35, p < 0.001;
      Fig. 2A and B).
    section: results
    start_char: 20686
    end_char: 20936
  - text: Although the total abundance of large trees (>20 cm DBH) declined within forest plots by 21% in 1996 compared to
      1981, this reduction was much less than that for smaller size classes (<20 cm DBH) of 57% between years (Fig. 2A and
      B).
    section: results
    start_char: 21876
    end_char: 22109
  - text: This finding suggests that culling alone may only reduce rather than eliminate the negative impacts of high deer
      densities (>10 deer km-2 ) on tree density and composition observed at our site and in many other temperate forests
      ([Putman et al., 1989; Veblen et al., 1989; Husheer et al., 2003;](#page-6-0) [Mountford and Peterken, 2003](#page-6-0)).
    section: discussion
    start_char: 27764
    end_char: 28114
  - text: Reductions in small trees associated with high deer densities can have cascading effects into larger size classes
      over time, leading to continual declines in canopy trees without any regeneration even when browse pressures are removed.
    section: discussion
    start_char: 28115
    end_char: 28350
  - text: These results provide further evidence for deer rather than succession or wind-induced canopy gaps as the principal
      driver of forest regeneration at our site, particularly since understorey light levels did not increase after the 1998
      windstorm.
    section: discussion
    start_char: 32724
    end_char: 32969
  annotator: camo_agent:claude-opus-5-5
- id: causal_mosaic:white_tailed_deer_density_036f
  name: white-tailed deer density
  entity_type: taxon
