  - text: Despite this, total growth increment over the two-year period was still significantly greater in the short size
      class relative to tall size class on both the Plow and Well-site due to differences in root-toshoot ratio, further illustrating
      the influence of initial morphology of seedling stock on initial establishment (Grossnickle 2012).
